name: ci

# Self-hosted mirror of the lab's public repository checks, so that every push
# is verified here before it is filed upstream. Two of the jobs replicate the
# checks the Agent-Authority-Conformance lab runs on interop filings
# (repository hygiene and digest integrity); the third goes one step further
# and re-runs the runner itself, gating on a byte-identical reproduction of the
# recorded output.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Absolute local paths
        run: |
          set -euo pipefail
          hits=$(git ls-files -z \
            | grep -zv -E '^\.github/workflows/ci\.yml$' \
            | xargs -0 grep -n -E '/Users/|/home/' /dev/null 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Absolute local path in tracked files:"
            printf '%s\n' "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "ok: no absolute local paths"

      - name: Secret-shaped files
        run: |
          set -euo pipefail
          hits=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|jks|keystore)$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::Secret-shaped file committed:"
            printf '%s\n' "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "ok: no secret-shaped files"

      - name: Committed dependencies or build output
        run: |
          set -euo pipefail
          hits=$(git ls-files | grep -E '(^|/)(node_modules|dist)/' || true)
          if [ -n "$hits" ]; then
            echo "::error::node_modules or dist committed:"
            printf '%s\n' "$hits" | head -50 | sed 's/^/  /'
            exit 1
          fi
          echo "ok: no committed node_modules or dist"

      - name: CRLF anywhere in the repository
        run: |
          set -euo pipefail
          hits=$(git ls-files | tr '\n' '\0' | xargs -0 -r grep -l -U -P '\r' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::CRLF in tracked files:"
            printf '%s\n' "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "ok: no CRLF"

  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify every digest manifest
        run: python3 tests/digest_integrity.py

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Rerun the runner; output must reproduce the recorded bytes
        run: |
          set -euo pipefail
          python3 lra-runner/lra_runner.py --json > "$RUNNER_TEMP/run.json"
          cmp "$RUNNER_TEMP/run.json" lra-runner/run-output.json
          python3 -c "import json; j=json.load(open('$RUNNER_TEMP/run.json')); assert j['status']=='independent_run_matched', j['status']; assert j['digest_gate'] is True; assert j['baseline_runs']==48 and j['baseline_failures']==0; print('runner ok:', j['baseline_runs'], 'runs,', j['baseline_calls'], 'calls,', j['baseline_scored_axes'], 'axes')"

      - name: Rerun the runner (revision 3); output must reproduce the recorded bytes
        run: |
          set -euo pipefail
          python3 lra-runner/lra_runner.py --revision 3 --json > "$RUNNER_TEMP/run-rev3.json"
          cmp "$RUNNER_TEMP/run-rev3.json" lra-runner/run-output-rev3.json
          python3 -c "import json; j=json.load(open('$RUNNER_TEMP/run-rev3.json')); assert j['status']=='independent_run_matched', j['status']; assert j['digest_gate'] is True; assert j['baseline_runs']==48 and j['baseline_failures']==0; print('runner rev3 ok:', j['baseline_runs'], 'runs,', j['baseline_calls'], 'calls,', j['baseline_scored_axes'], 'axes')"

      - name: Rerun the icam runner; output must reproduce the recorded bytes
        run: |
          set -euo pipefail
          python3 -I icam-runner/icam_runner.py icam-runner/vendor/vectors.json "$RUNNER_TEMP/icam.json"
          cmp "$RUNNER_TEMP/icam.json" icam-runner/run-output.json
          python3 -c "import json; j=json.load(open('$RUNNER_TEMP/icam.json')); s=j['summary']; assert s=={'cases':24,'agree':24,'mutants':6,'mutants_killed':6}, s; print('icam runner ok: 24/24 agree, 6/6 killed')"

      - name: Rerun the family runner over the six candidate families; output must reproduce the recorded bytes
        run: |
          set -euo pipefail
          python3 -I family-runner/family_runner.py candidates "$RUNNER_TEMP/families.json"
          cmp "$RUNNER_TEMP/families.json" family-runner/run-output.json
          python3 -c "import json; j=json.load(open('$RUNNER_TEMP/families.json')); s=j['summary']; assert s=={'cases':125,'agree':125,'mutants':94,'mutants_killed':94}, s; print('family runner ok:', s['cases'], 'cases agree,', s['mutants_killed'], 'mutants killed')"

      - name: Rerun the aae candidate pipeline; output must reproduce the recorded bytes
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography==50.0.2 jsonschema==4.26.0 jcs==0.2.1 pytest==9.2.0
          sh aae-runner/moltycel-aae-vectors/run.sh > "$RUNNER_TEMP/aae-run.txt" 2>&1
          python3 -c "import os,re,sys; norm=lambda s: re.sub(r'[0-9]+ passed in [0-9.]+s', lambda m: m.group(0).split(' in ')[0]+' in T', s.replace(chr(13)+chr(10), chr(10))).rstrip(chr(10)); a=norm(open('aae-runner/run-output.txt',encoding='utf-8').read()); b=norm(open(os.path.join(os.environ['RUNNER_TEMP'],'aae-run.txt'),encoding='utf-8',errors='replace').read()); sys.exit(0) if a==b else (print('aae replay drift'), sys.exit(1))"
          echo "aae replay ok: recorded output reproduced (pytest elapsed-time figure normalised)"
